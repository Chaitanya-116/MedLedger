# A generic, single database configuration.

[alembic]
# path to migration script
script_location = alembic

# template used to generate migration file names; The default uses the
# alembic revision id and string message.
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone = UTC

# max length of characters which are used to render the
# string message in the migration file name
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to alembic/versions.  When using multiple version
# directories, initial revisions must be created with --version-path.
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# set to 'true' to search source_paths recursively for
# revisions.  default is false
# recursive_version_locations = false

# encode log outputs with specified encoding
# output_encoding = utf-8

# Database URL is loaded dynamically from app.core.config (via env.py).
# Do NOT hardcode connection strings here.
# sqlalchemy.url = sqlite:///./medledger.db

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly-generated revision files.

[logging]
default_level = INFO
